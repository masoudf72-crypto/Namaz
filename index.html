.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(4,11,20,.15))}
.heroContent{position:absolute;inset:0;padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.heroTitle{font-size:26px;font-weight:bold}.heroSub{font-size:12px;color:#b9c5d4;margin-top:5px}.moon{font-size:24px}
.datebar{display:flex;align-items:center;justify-content:space-between}.datebar button{background:#112034;width:36px;height:36px;border-radius:12px}.date{text-align:center}.date b{display:block;font-size:15px}.date span{font-size:11px;color:#91a1b5}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}.sectionTitle h2{font-size:16px;margin:0}.sectionTitle span{font-size:11px;color:var(--muted)}
.prayerCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.prayerHead{display:flex;align-items:center;gap:10px}.picon{width:45px;height:45px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;font-size:22px}.pname{font-weight:bold;font-size:14px}.ptime{font-size:10px;color:var(--muted);margin-top:3px}.statusPill{margin-right:auto;font-size:10px;color:#aebdcd}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.choice{min-height:40px;border-radius:11px;background:#172638;color:#92a1b3;font-size:9px;border:1px solid transparent}.choice span{display:block;font-size:15px}.choice.sel{border-color:#fff4;box-shadow:inset 0 0 0 1px #fff2}.choice.c1.sel{background:#123d29;color:#66e69a}.choice.c2.sel{background:#12355a;color:#70b7ff}.choice.c3.sel{background:#4a3b12;color:#f3d65d}.choice.c4.sel{background:#4b291b;color:#ff9b6d}.choice.c5.sel{background:#4a1f25;color:#ff7373}
.quickGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.quick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 3px;text-align:center}.quick img{width:39px;height:39px;border-radius:11px;object-fit:cover;display:block;margin:auto}.quick b{font-size:9px;display:block;margin-top:5px}.quick .tick{margin-top:5px;width:22px;height:22px;border-radius:7px;background:#3a4554;color:#b5c1ce;display:inline-grid;place-items:center}.quick.done .tick{background:#174d32;color:#59e18e}.quick.done{border-color:#27553f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.monthNav{display:flex;align-items:center;justify-content:space-between}.monthNav button{background:var(--panel2);width:35px;height:35px;border-radius:11px}.monthTitle{text-align:center}.monthTitle b{display:block;font-size:14px}.monthTitle span{font-size:10px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:13px}.calCell{height:35px;border-radius:9px;background:#142235;display:grid;place-items:center;font-size:10px;color:#aeb9c8}.calHead{background:transparent;color:#718198}.calCell.g{background:#15502f;color:#8df0b3}.calCell.b{background:#15416d;color:#91c7ff}.calCell.y{background:#55440f;color:#f7db68}.calCell.o{background:#59301f;color:#ffac86}.calCell.r{background:#5a2027;color:#ff8c8c}.calCell.today{outline:2px solid var(--cyan)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:rgba(9,18,30,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(12px)}.navBtn{background:transparent;color:#72849a;font-size:10px;padding:4px}.navBtn .ni{font-size:20px;display:block;margin-bottom:3px}.navBtn.active{color:var(--cyan)}
.page{display:none;padding:0 14px}.page.active{display:block}
.reportTabs{display:flex;background:#0e1a29;padding:4px;border-radius:13px;margin:10px 0 14px}.reportTab{flex:1;padding:9px;border-radius:10px;background:transparent;color:#8493a7;font-size:11px}.reportTab.active{background:#1a2b40;color:white}
.reportPrayerCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0}.rpHead{display:flex;align-items:center;gap:10px;cursor:pointer}.rpIcon{width:43px;height:43px;border-radius:13px;background:var(--panel3);display:grid;place-items:center;font-size:21px}.rpMain{flex:1}.rpName{font-weight:bold;font-size:14px}.rpMeta{font-size:10px;color:var(--muted);margin-top:4px}.rpPct{font-size:19px;color:#6fe39a;font-weight:bold}.detail{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.detail.open{display:block}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dBox{background:var(--panel2);border-radius:12px;padding:10px}.dBox b{font-size:19px}.dBox small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:10px}.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}.tbl th{color:var(--muted);font-weight:normal}.miniBar{height:6px;background:#223044;border-radius:8px;overflow:hidden}.miniBar i{display:block;height:100%;border-radius:8px}
.habitCard{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:10px;margin:9px 0}.habitCard img{width:50px;height:50px;border-radius:14px;object-fit:cover}.habitMain{flex:1}.habitName{font-weight:bold;font-size:13px}.habitMeta{font-size:9px;color:var(--muted);margin-top:4px}.hbar{height:7px;background:#243247;border-radius:8px;overflow:hidden;margin-top:8px}.hbar i{display:block;height:100%;background:#29c77a}.hPct{font-size:16px;font-weight:bold;color:#65df98}
.homeCards{display:grid;gap:10px}.homeAction{background:linear-gradient(135deg,#101e31,#142941);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}.homeAction .bigIcon{width:50px;height:50px;border-radius:15px;background:#173a5b;display:grid;place-items:center;font-size:24px}.homeAction b{font-size:14px}.homeAction small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.arrow{margin-right:auto;color:#72849a;font-size:20px}

const prayers=[['صبح','🌅','۰۵:۱۰'],['ظهر','☀️','۱۳:۰۵'],['عصر','🌤️','۱۶:۳۵'],['مغرب','🌇','۱۸:۴۵'],['عشا','🌙','۲۰:۱۰']];
const states=[['اول وقت','🟢','c1'],['جماعت','🔵','c2'],['غیر اول وقت','🟡','c3'],['آخر وقت','🟠','c4'],['قضا','🔴','c5']];
const habits=[['قرآن',IMG.quran],['زیارت عاشورا',IMG.ashura],['اشک',IMG.cry],['صحبت با مولا','https://www.irancultura.it/wp-content/uploads/2018/05/Qom-La-Moschea-Di-Jamkaran-4-min.jpg'],['نماز شب',IMG.night]];
let d=new Date();d.setHours(12,0,0,0);let viewMonth=new Date(d.getFullYear(),d.getMonth(),1);
let data=JSON.parse(localStorage.getItem('namazData')||'{}');
const key=x=>{
  const y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),dd=String(x.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
};
function fa(n){return String(n).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x])}
function save(){localStorage.setItem('namazData',JSON.stringify(data))}
function go(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');
 document.querySelectorAll('.navBtn').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');else document.querySelectorAll('.navBtn')[id==='home'?0:id==='calendar'?1:2].classList.add('active');
 if(id==='home')renderHome();
 if(id==='calendar'){const j=jalaliParts(d);calJYear=j.year;calJMonth=j.month;renderCalendar();}
 if(id==='report'){renderPrayerReport();renderHabitReport()}
 if(id==='daily')renderDaily();
}
function moveDay(n){d.setDate(d.getDate()+n);renderHome();renderDaily()}
function statusText(v){if(v==null)return 'ثبت نشده';let a=Array.isArray(v)?v:[v];return a.map(x=>states[x][0]).join(' + ')}
function setState(i,j){
 let k=key(d);data[k]??={};let v=data[k][i];
 if(j===1){let a=Array.isArray(v)?v.slice():(v==null?[]:[v]);a.includes(1)?a=a.filter(x=>x!==1):a.push(1);data[k][i]=a.length?a:null}
 else{let a=Array.isArray(v)?v.filter(x=>x===1):[];a.push(j);data[k][i]=a}
 save();renderHome();renderDaily()
}
function setHabit(i){let k=key(d);data[k]??={};data[k]['e'+i]=data[k]['e'+i]!==true;save();renderHome();renderDaily()}
function prayerCards(){
 let k=key(d),r=data[k]||{};
 return prayers.map((p,i)=>{let v=r[i];return `<div class="prayerCard"><div class="prayerHead"><div class="picon">${p[1]}</div><div><div class="pname">نماز ${p[0]}</div><div class="ptime">${p[2]}</div></div><div class="statusPill">${statusText(v)}</div></div><div class="choices">${states.map((s,j)=>{let sel=Array.isArray(v)?v.includes(j):v===j;return `<button class="choice ${s[2]} ${sel?'sel':''}" onclick="setState(${i},${j})"><span>${s[1]}</span>${s[0]}</button>`}).join('')}</div></div>`}).join('')
}

 let k=key(d),r=data[k]||{};

function faDigitsToEn(s){
  return String(s).replace(/[۰-۹]/g,ch=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(ch));
}
function jalaliParts(date){
  const parts=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{
    year:'numeric',month:'numeric',day:'numeric'
  }).formatToParts(date);
  const o={};
  for(const p of parts){
    if(p.type==='year'||p.type==='month'||p.type==='day') o[p.type]=parseInt(p.value,10);
  }
  return o;
}
function jalaliStartGregorian(y,m){
  // 13 Mehr 1405 is Monday 2026-10-05. Use a nearby Gregorian date
  // and search for the exact Jalali month/day, avoiding timezone/UTC drift.
  const anchor=new Date(2026,9,5,12,0,0,0);
  const aj=jalaliParts(anchor);
  const approx=new Date(anchor);
  const monthDelta=(y-aj.year)*12+(m-aj.month);
  approx.setMonth(approx.getMonth()+monthDelta);
  for(let off=-40;off<=40;off++){
    const x=new Date(approx);
    x.setDate(approx.getDate()+off);
    if(jalaliParts(x).year===y && jalaliParts(x).month===m && jalaliParts(x).day===1) return x;
  }
  return null;
}
function jalaliMonthDays(y,m){
  if(m<=6) return 31;
  if(m<=11) return 30;
  return 29; // requested: Esfand 29 days
}
let jp=jalaliParts(d);
let calJYear=jp.year, calJMonth=jp.month;
function changeMonth(n){
  calJMonth+=n;
  if(calJMonth>12){calJMonth=1;calJYear++}
  if(calJMonth<1){calJMonth=12;calJYear--}
  renderCalendar();
}
function renderCalendar(){
  const first=jalaliStartGregorian(calJYear,calJMonth);
  const days=jalaliMonthDays(calJYear,calJMonth);
  const names=['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  document.getElementById('calMonth').textContent=`${names[calJMonth]} ${fa(calJYear)}`;
  const persianStart=(first.getDay()+1)%7; // Saturday=0
  let h=['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="calCell calHead">${x}</div>`).join('');
  for(let i=0;i<persianStart;i++) h+='<div></div>';
  for(let jd=1;jd<=days;jd++){
    const x=new Date(first);
    x.setDate(first.getDate()+jd-1);
    const r=data[key(x)]||{};
    let vals=Object.values(r).filter(v=>typeof v==='number'||Array.isArray(v));
    let cls='';
    if(vals.length){
      const c=[0,0,0,0,0];
      vals.forEach(v=>(Array.isArray(v)?v:[v]).forEach(z=>{if(c[z]!=null)c[z]++}));
      cls=['g','b','y','o','r'][c.indexOf(Math.max(...c))];
    }
    const today=key(x)===key(d)?' today':'';
    h+=`<div class="calCell ${cls}${today}" onclick="pickJalaliDay(${jd})">${fa(jd)}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML=h;
}
function pickJalaliDay(jd){
  const first=jalaliStartGregorian(calJYear,calJMonth);
  d=new Date(first);
  d.setDate(first.getDate()+jd-1);
  d.setHours(12,0,0,0);
  go('daily');
}

 prayers.map((p,i)=>{let c=[0,0,0,0,0],reg=0;for(let day=1;day<=days;day++){let r=data[key(new Date(y,m,day))]||{},v=r[i];if(v!=null){reg++;(Array.isArray(v)?v:[v]).forEach(z=>c[z]++)}}let pct=Math.round(reg/days*100);let names=['اول وقت','جماعت','غیر اول وقت','آخر وقت','قضا'],icons=['🟢','🔵','🟡','🟠','🔴'],colors=['#39d783','#239cff','#f0c438','#ff7b42','#ef4444'];return `<div class="reportPrayerCard"><div class="rpHead" onclick="toggle(${i})"><div class="rpIcon">${p[1]}</div><div class="rpMain"><div class="rpName">نماز ${p[0]}</div><div class="rpMeta">${fa(reg)} از ${fa(days)} روز ثبت شده</div></div><div class="rpPct">${fa(pct)}٪</div></div><div class="detail" id="detail${i}"><div class="detailGrid"><div class="dBox"><b>${fa(reg)}</b><small>تعداد ثبت‌شده</small></div><div class="dBox"><b>${fa(days-reg)}</b><small>ثبت‌نشده</small></div></div><table class="tbl"><tr><th>وضعیت</th><th>تعداد</th><th>درصد</th><th></th></tr>${names.map((n,j)=>{let q=reg?Math.round(c[j]/reg*100):0;return `<tr><td>${icons[j]} ${n}</td><td>${fa(c[j])}</td><td>${fa(q)}٪</td><td><div class="miniBar"><i style="width:${q}%;background:${colors[j]}"></i></div></td></tr>`}).join('')}</table></div></div>`}).join('')
}
function renderHabitReport(){

}
