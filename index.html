.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(4,11,20,.15))}
.heroContent{position:absolute;inset:0;padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.heroTitle{font-size:26px;font-weight:bold}.heroSub{font-size:12px;color:#b9c5d4;margin-top:5px}.moon{font-size:24px}
.datebar{display:flex;align-items:center;justify-content:space-between}.datebar button{background:#112034;width:36px;height:36px;border-radius:12px}.date{text-align:center}.date b{display:block;font-size:15px}.date span{font-size:11px;color:#91a1b5}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}.sectionTitle h2{font-size:16px;margin:0}.sectionTitle span{font-size:11px;color:var(--muted)}
.prayerCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.prayerHead{display:flex;align-items:center;gap:10px}.picon{width:45px;height:45px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;font-size:22px}.pname{font-weight:bold;font-size:14px}.ptime{font-size:10px;color:var(--muted);margin-top:3px}.statusPill{margin-right:auto;font-size:10px;color:#aebdcd}

.quickGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.quick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 3px;text-align:center}.quick img{width:39px;height:39px;border-radius:11px;object-fit:cover;display:block;margin:auto}.quick b{font-size:9px;display:block;margin-top:5px}.quick .tick{margin-top:5px;width:22px;height:22px;border-radius:7px;background:#3a4554;color:#b5c1ce;display:inline-grid;place-items:center}.quick.done .tick{background:#174d32;color:#59e18e}.quick.done{border-color:#27553f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.monthNav{display:flex;align-items:center;justify-content:space-between}.monthNav button{background:var(--panel2);width:35px;height:35px;border-radius:11px}.monthTitle{text-align:center}.monthTitle b{display:block;font-size:14px}.monthTitle span{font-size:10px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:13px}.calCell{height:35px;border-radius:9px;background:#142235;display:grid;place-items:center;font-size:10px;color:#aeb9c8}.calHead{background:transparent;color:#718198}.calCell.g{background:#15502f;color:#8df0b3}.calCell.b{background:#15416d;color:#91c7ff}.calCell.y{background:#55440f;color:#f7db68}.calCell.o{background:#59301f;color:#ffac86}.calCell.r{background:#5a2027;color:#ff8c8c}.calCell.today{outline:2px solid var(--cyan)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:rgba(9,18,30,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(12px)}.navBtn{background:transparent;color:#72849a;font-size:10px;padding:4px}.navBtn .ni{font-size:20px;display:block;margin-bottom:3px}.navBtn.active{color:var(--cyan)}
.page{display:none;padding:0 14px}.page.active{display:block}
.reportTabs{display:flex;background:#0e1a29;padding:4px;border-radius:13px;margin:10px 0 14px}.reportTab{flex:1;padding:9px;border-radius:10px;background:transparent;color:#8493a7;font-size:11px}.reportTab.active{background:#1a2b40;color:white}
.reportPrayerCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0}.rpHead{display:flex;align-items:center;gap:10px;cursor:pointer}.rpIcon{width:43px;height:43px;border-radius:13px;background:var(--panel3);display:grid;place-items:center;font-size:21px}.rpMain{flex:1}.rpName{font-weight:bold;font-size:14px}.rpMeta{font-size:10px;color:var(--muted);margin-top:4px}.rpPct{font-size:19px;color:#6fe39a;font-weight:bold}.detail{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.detail.open{display:block}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dBox{background:var(--panel2);border-radius:12px;padding:10px}.dBox b{font-size:19px}.dBox small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:10px}.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}.tbl th{color:var(--muted);font-weight:normal}.miniBar{height:6px;background:#223044;border-radius:8px;overflow:hidden}.miniBar i{display:block;height:100%;border-radius:8px}

function faDigitsToEn(s){

}
function jalaliParts(date){
  const parts=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{
    year:'numeric',month:'numeric',day:'numeric'
  }).formatToParts(date);
  const o={};
  for(const p of parts){
    if(p.type==='year'||p.type==='month'||p.type==='day') o[p.type]=parseInt(p.value,10);
  }
  return o;
}
function jalaliStartGregorian(y,m){
  // 13 Mehr 1405 is Monday 2026-10-05. Use a nearby Gregorian date
  // and search for the exact Jalali month/day, avoiding timezone/UTC drift.
  const anchor=new Date(2026,9,5,12,0,0,0);
  const aj=jalaliParts(anchor);
  const approx=new Date(anchor);
  const monthDelta=(y-aj.year)*12+(m-aj.month);
  approx.setMonth(approx.getMonth()+monthDelta);
  for(let off=-40;off<=40;off++){
    const x=new Date(approx);
    x.setDate(approx.getDate()+off);
    if(jalaliParts(x).year===y && jalaliParts(x).month===m && jalaliParts(x).day===1) return x;
  }
  return null;
}
function jalaliMonthDays(y,m){
  if(m<=6) return 31;
  if(m<=11) return 30;
  return 29; // requested: Esfand 29 days
}

  const first=jalaliStartGregorian(calJYear,calJMonth);
  const days=jalaliMonthDays(calJYear,calJMonth);
  const names=['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  document.getElementById('calMonth').textContent=`${names[calJMonth]} ${fa(calJYear)}`;
  const persianStart=(first.getDay()+1)%7; // Saturday=0
  let h=['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="calCell calHead">${x}</div>`).join('');
  for(let i=0;i<persianStart;i++) h+='<div></div>';
  for(let jd=1;jd<=days;jd++){
    const x=new Date(first);
    x.setDate(first.getDate()+jd-1);
    const r=data[key(x)]||{};
    let vals=Object.values(r).filter(v=>typeof v==='number'||Array.isArray(v));
    let cls='';
    if(vals.length){
      const c=[0,0,0,0,0];
      vals.forEach(v=>(Array.isArray(v)?v:[v]).forEach(z=>{if(c[z]!=null)c[z]++}));
      cls=['g','b','y','o','r'][c.indexOf(Math.max(...c))];
    }
    const today=key(x)===key(d)?' today':'';
    h+=`<div class="calCell ${cls}${today}" onclick="pickJalaliDay(${jd})">${fa(jd)}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML=h;
}
function pickJalaliDay(jd){
  const first=jalaliStartGregorian(calJYear,calJMonth);
  d=new Date(first);
  d.setDate(first.getDate()+jd-1);
  d.setHours(12,0,0,0);
  go('daily');
}
function reportPart(part,el){document.querySelectorAll('.reportTab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('reportPrayer').style.display=part==='prayer'?'block':'none';document.getElementById('reportHabits').style.display=part==='habits'?'block':'none';document.getElementById('reportWrongs').style.display=part==='wrongs'?'block':'none';if(part==='prayer')renderPrayerReport();else if(part==='habits')renderHabitReport();else renderWrongReport()}
function toggle(i){document.getElementById('detail'+i).classList.toggle('open')}
let reportJ=jalaliParts(d), reportJYear=reportJ.year, reportJMonth=reportJ.month, reportZoom=1;
function reportMonthMove(n){reportJMonth+=n;if(reportJMonth>12){reportJMonth=1;reportJYear++}if(reportJMonth<1){reportJMonth=12;reportJYear--}renderPrayerReport()}
function reportZoomSet(n){reportZoom=Math.max(.75,Math.min(1.15,reportZoom+n));renderPrayerReport()}
function prayerCellClass(v){
  if(v==null)return 'emptyCell';
  const a=Array.isArray(v)?v:[v], hasJ=a.includes(1);
  if(a.includes(4))return 'st4';
  if(a.includes(3))return 'st3';
  if(a.includes(0))return hasJ?'st01':'st0';
  if(a.includes(2))return hasJ?'st21':'st2';
  if(hasJ)return 'st1only';
  return 'emptyCell';
}
function prayerCellLabel(v){
  if(v==null)return '—';
  const a=Array.isArray(v)?v:[v];
  if(a.includes(4))return 'قضا';
  if(a.includes(3))return 'آخر وقت';
  if(a.includes(0)&&a.includes(1))return 'اول وقت + جماعت';
  if(a.includes(0))return 'اول وقت';
  if(a.includes(2)&&a.includes(1))return 'غیر اول وقت + جماعت';
  if(a.includes(2))return 'غیر اول وقت';
  if(a.includes(1))return 'جماعت';
  return '—';
}
function renderPrayerReport(){
  const first=jalaliStartGregorian(reportJYear,reportJMonth), days=jalaliMonthDays(reportJYear,reportJMonth);
  const names=['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const monthName=names[reportJMonth];
  let html=`<div class="monthlyWrap"><div class="monthlyTop"><button class="zoomBtn" onclick="reportMonthMove(-1)">‹</button><div class="monthTitle"><b>${monthName} ${fa(reportJYear)}</b><div class="monthlyHint">همه نمازهای ماه در یک جدول</div></div><button class="zoomBtn" onclick="reportMonthMove(1)">›</button><div class="zoomBox"><button class="zoomBtn" onclick="reportZoomSet(-.1)">−</button><button class="zoomBtn" onclick="reportZoomSet(.1)">+</button></div></div><div class="tableScroll"><table class="monthTable" style="font-size:${9*reportZoom}px"><thead><tr><th>تاریخ</th><th>صبح</th><th>ظهر</th><th>عصر</th><th>مغرب</th><th>عشا</th></tr></thead><tbody>`;
  const counts=[0,0,0,0,0], labels=['اول وقت به جماعت','اول وقت غیر جماعت','غیر اول وقت به جماعت','غیر اول وقت غیر جماعت','آخر وقت','قضا'];
  let qCount=0,jCount=0,lateCount=0,qaCount=0;
  for(let jd=1;jd<=days;jd++){
    const x=new Date(first);x.setDate(first.getDate()+jd-1);const r=data[key(x)]||{};
    html+=`<tr><td class="dateCell">${fa(reportJMonth)}/${fa(jd)}</td>`;
    for(let i=0;i<5;i++){const v=r[i];const cls=prayerCellClass(v);html+=`<td class="${cls}" title="${prayerCellLabel(v)}">${cls==='emptyCell'?'—':''}</td>`;
      if(v!=null){const a=Array.isArray(v)?v:[v];const hasJ=a.includes(1);const timing=a.find(z=>z!==1);if(timing===0){if(hasJ)jCount++;else qCount++}else if(timing===2){if(hasJ)counts[2]++;else counts[3]++}else if(timing===3){lateCount++}else if(timing===4){qaCount++}}
    }
  }
  const summary=`<div class="reportSummary"><div class="summaryTitle">خلاصه وضعیت نمازهای ${monthName}</div><div class="summaryGrid"><span>اول وقت به جماعت: <b>${fa(jCount)}</b></span><span>اول وقت غیر جماعت: <b>${fa(qCount)}</b></span><span>غیر اول وقت به جماعت: <b>${fa(counts[2])}</b></span><span>غیر اول وقت غیر جماعت: <b>${fa(counts[3])}</b></span><span>آخر وقت: <b>${fa(lateCount)}</b></span><span>قضا: <b>${fa(qaCount)}</b></span></div></div>`;
  html+=`</tbody></table></div><div class="legendGrid"><div class="legendItem"><i class="legendSwatch st0"></i>اول وقت</div><div class="legendItem"><i class="legendSwatch st01"></i>اول وقت + جماعت</div><div class="legendItem"><i class="legendSwatch st2"></i>غیر اول وقت</div><div class="legendItem"><i class="legendSwatch st21"></i>غیر اول وقت + جماعت</div><div class="legendItem"><i class="legendSwatch st3"></i>آخر وقت</div><div class="legendItem"><i class="legendSwatch st4"></i>قضا</div></div>${summary}</div>`;
  document.getElementById('reportPrayer').innerHTML=html;
}
function reportJalaliNav(n){reportJMonth+=n;if(reportJMonth>12){reportJMonth=1;reportJYear++}if(reportJMonth<1){reportJMonth=12;reportJYear--}renderHabitReport();renderWrongReport()}
function reportMonthHeader(title){const names=['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];return `<div class="monthlyTop"><button class="zoomBtn" onclick="reportJalaliNav(-1)">‹</button><div class="monthTitle"><b>${names[reportJMonth]} ${fa(reportJYear)}</b><div class="monthlyHint">گزارش ماهانه</div></div><button class="zoomBtn" onclick="reportJalaliNav(1)">›</button></div>`}
function renderWrongReport(){
 const first=jalaliStartGregorian(reportJYear,reportJMonth),days=jalaliMonthDays(reportJYear,reportJMonth);
 const totals={};wrongs.forEach(([t,type])=>totals[type]=0);
 const rows=Array.from({length:days},(_,i)=>{const x=new Date(first);x.setDate(first.getDate()+i);const r=data[key(x)]||{},counts=r.wrongCounts||{};return `<tr><td class="rdate">${fa(reportJMonth)}/${fa(i+1)}</td>${wrongs.map(([t,type])=>{const c=Number(counts[type]||0);totals[type]+=c;return `<td class="${c?'rred':'rempty'}">${c?fa(c):''}</td>`}).join('')}</tr>`}).join('');
 const summary=`<div class="reportSummary"><div class="summaryTitle">تعداد اشتباه‌های ${reportJMonth===7?'مهر':''}${reportJMonth!==7?'این ماه':''}</div><div class="summaryGrid">${wrongs.map(([t,type])=>`<span>${t.replace('غلط ','')}: <b>${fa(totals[type])}</b></span>`).join('')}</div></div>`;
 document.getElementById('reportWrongs').innerHTML=`<div class="monthlyWrap">${reportMonthHeader('غلط هام')}<div class="tableScroll"><table class="reportTable"><thead><tr><th>تاریخ</th>${wrongs.map(x=>`<th>${x[0].replace('غلط ','')}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${summary}<div class="monthlyHint" style="margin-top:8px">قرمز = حداقل یک بار اشتباه ثبت شده؛ عدد داخل خانه تعداد اشتباه‌هاست.</div></div>`;
}
function renderHabitReport(){
 const first=jalaliStartGregorian(reportJYear,reportJMonth),days=jalaliMonthDays(reportJYear,reportJMonth);
 const totals=habits.map(()=>({done:0,not:0}));
 const rows=Array.from({length:days},(_,i)=>{const x=new Date(first);x.setDate(first.getDate()+i);const r=data[key(x)]||{};return `<tr><td class="rdate">${fa(reportJMonth)}/${fa(i+1)}</td>${habits.map((h,j)=>{const done=r['e'+j]===true;done?totals[j].done++:totals[j].not++;return `<td class="${done?'rgreen':'rred'}">${done?'✓':'×'}</td>`}).join('')}</tr>`}).join('');
 const summary=`<div class="reportSummary"><div class="summaryTitle">خلاصه کارهای ${reportJMonth===7?'مهر':''}${reportJMonth!==7?'این ماه':''}</div><div class="summaryGrid">${habits.map((h,j)=>`<span>${h[0]} — انجام شده: <b>${fa(totals[j].done)}</b> · انجام نشده: <b>${fa(totals[j].not)}</b></span>`).join('')}</div></div>`;
 document.getElementById('reportHabits').innerHTML=`<div class="monthlyWrap">${reportMonthHeader('کارهای روزانه')}<div class="tableScroll"><table class="reportTable"><thead><tr><th>تاریخ</th>${habits.map(h=>`<th>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${summary}<div class="monthlyHint" style="margin-top:8px">سبز = انجام شده · قرمز = انجام نشده</div></div>`;
}
renderHome();
</script>
